name: Deploy

# Builds the docs site (apps/docs, server output with the MCP server) and ships
# it to Cloudflare Workers. Runs on every push to main, on demand, and from
# release.yml after a publish so the changelog picks up the new GitHub release.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy-docs
  cancel-in-progress: true

# The token only reads GitHub releases for the changelog; deploying to
# Cloudflare uses CLOUDFLARE_API_TOKEN, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so `lastModified` stamps come from git.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        name: Install Bun

      - uses: actions/cache@v6
        name: Setup Bun cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Rendered OG cards, keyed by content (see packages/blume/src/og/cache.ts),
      # so only the cards whose page title or description changed render again.
      # The key is unique per run so every run saves its pruned set; restoring
      # the newest entry is safe because a card that no longer matches is
      # simply not reused.
      - uses: actions/cache@v6
        name: Restore OG card cache
        with:
          path: apps/docs/node_modules/.cache/blume/og
          key: ${{ runner.os }}-blume-og-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-blume-og-

      - name: Build docs
        env:
          # Changelog is built from GitHub releases; the token avoids rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx turbo run build --filter=docs

      - name: Deploy docs to Cloudflare Workers
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy
