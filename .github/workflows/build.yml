name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # Rendered OG cards, keyed by content (see packages/blume/src/og/cache.ts),
      # so only the cards whose page title or description changed render again.
      # The key is unique per run so every run saves its pruned set; restoring
      # the newest entry is safe because a card that no longer matches is
      # simply not reused.
      - uses: actions/cache@v6
        name: Restore OG card cache
        with:
          path: apps/docs/node_modules/.cache/blume/og
          key: ${{ runner.os }}-blume-og-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-blume-og-

      - name: Build docs
        # Google's CSS API occasionally references gstatic font files that
        # 404 mid-rollout, failing the build with CannotFetchFontFile. Retry
        # that specific transient failure (clearing the font cache so a stale
        # URL list isn't replayed); any other failure surfaces immediately.
        run: |
          cd apps/docs
          for attempt in 1 2 3; do
            bun run build 2>&1 | tee build.log && exit 0
            grep -q "CannotFetchFontFile" build.log || exit 1
            echo "Font CDN 404 on attempt ${attempt}; clearing font cache and retrying"
            rm -rf .blume/.astro/fonts
            sleep 15
          done
          exit 1
